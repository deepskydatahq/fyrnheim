[outcome]
description = "Fyrnheim can classify dbt inventory models with configurable inspectable rules and evidence."

[job_story]
description = "When I have a dbt inventory artifact, I want configurable rules to label each model with evidence so model purpose is explicit instead of tribal knowledge."

