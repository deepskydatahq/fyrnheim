  "Classification results include labels, primary label, evidence, and classified/unclassified/ambiguous status.",
  "Tests cover no-match, overlapping rules, precedence, and multiple-label mode."
]
validator_context = [
  "src/fyrnheim/dbt_classification.py",
  "tests/test_dbt_classification.py"
]

[context]
relevant_paths = ["src/fyrnheim/", "tests/"]
