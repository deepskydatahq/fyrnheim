  "The CLI reports project-wide and single-model principle results."
]
validator_context = [
  "src/fyrnheim/dbt_principles.py",
  "src/fyrnheim/cli.py",
  "tests/test_dbt_principles.py",
  "docs/dbt-data-model-principles.md"
]

[context]
relevant_paths = ["src/fyrnheim/", "tests/", "docs/"]
