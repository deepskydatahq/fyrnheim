# Story: Add provider runner and cleanup lifecycle

id = "M110-E001-S002"
parent = "M110-E001"
title = "Add provider runner and cleanup lifecycle"
status = "draft"
triage = "brainstorm"
created = 2026-06-20

[outcome]
description = "Extend the multi-model coding workflow from prepared prompts to actual provider command execution, and add safe worktree cleanup support after evaluator promotion."

[acceptance_criteria]
executable = true

[[acceptance_criteria.criteria]]
test = "unit"
description = "A run configuration can declare per-variant execution commands such as `claude -p prompt.md` or `codex exec prompt.md` without hard-coding providers."

[[acceptance_criteria.criteria]]
test = "unit"
description = "The runner executes each candidate command from its own worktree, captures stdout/stderr/exit code/duration, and writes artifacts under the candidate artifact directory."

[[acceptance_criteria.criteria]]
test = "unit"
description = "The runner supports a dry-run mode that shows commands and target worktrees without launching providers."

[[acceptance_criteria.criteria]]
test = "unit"
description = "A cleanup command lists and removes candidate worktrees only when they are clean or when an explicit force flag is provided."

[[acceptance_criteria.criteria]]
test = "manual"
description = "Docs explain how to run real provider-backed candidates, inspect logs, and clean up worktrees after judgement/promotion."

[context]
relevant_paths = [
  "scripts/multi_model_coding.py",
  "tests/test_multi_model_coding.py",
  "docs/multi-model-coding-workflow.md"
]
input_fixtures = []
depends_on = ["M110-E001-S001", "M110-E002-S001"]

[handoff]
implementation_hints = [
  "Dogfood M111 showed candidate execution is still manual/simulated even though preparation and judgement work.",
  "Keep provider integration command-based and configurable rather than importing provider SDKs.",
  "Prefer safe defaults: do not remove dirty worktrees unless the user explicitly passes a force flag."
]
reference_files = [
  "docs/m111-parallel-coding-dogfood-retro.md",
  ".pi/coding-runs/m111-troubleshooting/judgement.toml",
  "scripts/multi_model_coding.py"
]
